name: Suite de testes

# Os 199 testes do projeto so rodavam quando alguem lembrava de executa-los na
# maquina local. Aqui eles passam a rodar a cada envio e a cada pull request.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # O app nativo usa PySide6; sem servidor grafico o Qt precisa do backend
      # offscreen para instanciar widgets durante os testes.
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Executar a suite
        run: python -m pytest tests/ -q
