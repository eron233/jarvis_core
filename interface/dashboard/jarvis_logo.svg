<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="jarvisGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="glowBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Neural Ring -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="url(#jarvisGlow)" stroke-width="2" opacity="0.3" stroke-dasharray="6 4" />
  <circle cx="50" cy="50" r="34" fill="none" stroke="url(#jarvisGlow)" stroke-width="1.5" opacity="0.6" />

  <!-- Monogram J & Synapse Core -->
  <path d="M 58 28 L 58 56 C 58 66 50 72 40 72 C 32 72 26 66 26 58" fill="none" stroke="url(#jarvisGlow)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowBlur)" />

  <!-- Synapse Nodes -->
  <circle cx="58" cy="28" r="4" fill="#38BDF8" />
  <circle cx="40" cy="72" r="3.5" fill="#10B981" />
  <circle cx="26" cy="58" r="3" fill="#34D399" />
  <circle cx="50" cy="50" r="2.5" fill="#6EE7B7" />
</svg>
