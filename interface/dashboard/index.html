<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JARVIS — Sistema Cognitivo Operacional</title>
  <style>
    /* Estética Anthropic Claude Desktop / Claude Code */
    :root {
      --bg-app: #181715;
      --bg-sidebar: #1E1C1A;
      --bg-card: #242220;
      --bg-input: #2A2825;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-active: rgba(217, 119, 87, 0.4);
      --text-primary: #ECEBE8;
      --text-secondary: #B0AEA8;
      --text-muted: #85837D;
      --accent-claude: #D97757; /* Laranja Terroso característico do Claude */
      --accent-claude-hover: #E28769;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      --font-mono: "JetBrains Mono", "Cascadia Code", monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: var(--font-sans);
      background-color: var(--bg-app);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }

    .app-layout {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      width: 100vw;
      height: 100vh;
    }

    /* Sidebar Esquerda Minimalista estilo Claude */
    .sidebar {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-subtle);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 4px 16px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .brand-icon {
      width: 24px;
      height: 24px;
      background-color: var(--accent-claude);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.85rem;
      color: #181715;
    }

    .brand-name {
      font-size: 0.98rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text-primary);
    }

    .nav-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 16px;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text-secondary);
      background: transparent;
      border: none;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .nav-btn:hover, .nav-btn.active {
      background-color: var(--bg-card);
      color: var(--text-primary);
    }

    .sidebar-status {
      padding-top: 12px;
      border-top: 1px solid var(--border-subtle);
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--accent-claude);
    }

    /* Área Principal estilo Chat Claude Desktop */
    .main-content {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: var(--bg-app);
      position: relative;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .header-title {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .btn-action {
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-secondary);
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-action:hover {
      color: var(--text-primary);
      border-color: var(--border-active);
    }

    .chat-stream {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
    }

    .msg-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .msg-author {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .msg-content {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--text-primary);
      white-space: pre-wrap;
    }

    .msg-group.user .msg-content {
      color: #F7F6F3;
      background-color: var(--bg-card);
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
    }

    /* Composer de Texto estilo Claude */
    .composer-container {
      padding: 16px 24px 24px;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
    }

    .composer-wrapper {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color 0.15s ease;
    }

    .composer-wrapper:focus-within {
      border-color: var(--border-active);
    }

    .composer-textarea {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.95rem;
      resize: none;
      min-height: 48px;
      max-height: 200px;
    }

    .composer-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 8px;
      border-top: 1px solid var(--border-subtle);
    }

    .quick-tools {
      display: flex;
      gap: 6px;
    }

    .tool-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      font-size: 0.8rem;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
    }

    .tool-btn:hover {
      background-color: var(--bg-input);
      color: var(--text-primary);
    }

    .btn-send {
      background-color: var(--accent-claude);
      color: #181715;
      font-weight: 600;
      font-size: 0.82rem;
      padding: 6px 14px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn-send:hover {
      background-color: var(--accent-claude-hover);
    }

    /* Modal Discreto */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      background: rgba(0, 0, 0, 0.6);
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.active { display: flex; }

    /* Foco visível por teclado em todos os controles interativos */
    button:focus-visible,
    textarea:focus-visible {
      outline: 2px solid var(--accent-claude);
      outline-offset: 2px;
    }

    .composer-textarea:focus-visible {
      outline: none; /* o foco já é indicado pela borda do composer */
    }

    .composer-wrapper:focus-within {
      box-shadow: 0 0 0 1px var(--accent-claude);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .modal-content {
      width: min(720px, 90vw);
      background-color: var(--bg-sidebar);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 20px;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal-header-clean {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 14px;
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar estilo Claude Code/Desktop -->
    <aside class="sidebar">
      <div>
        <div class="brand">
          <div class="brand-icon" aria-hidden="true">J</div>
          <div class="brand-name">JARVIS</div>
        </div>

        <nav class="nav-group" aria-label="Navegação principal">
          <button type="button" class="nav-btn active" aria-current="page" onclick="switchTab('chat', this)">Conversa Principal</button>
          <button type="button" class="nav-btn" onclick="switchTab('graphify', this)">Graphify Topológico</button>
          <button type="button" class="nav-btn" aria-haspopup="dialog" aria-controls="thoughtModal" onclick="openThoughtModal()">Pensamentos do Dono</button>
          <button type="button" class="nav-btn" onclick="switchTab('system', this)">Sensores & Módulos</button>
        </nav>
      </div>

      <div class="sidebar-status" role="status" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <span>JARVIS Operacional</span>
      </div>
    </aside>

    <!-- Área Principal de Chat -->
    <main class="main-content">
      <header class="header">
        <h1 class="header-title" id="tabTitle">Sessão Atual</h1>
        <div class="header-actions">
          <button type="button" class="btn-action" onclick="clearStream()">Limpar Chat</button>
          <button type="button" class="btn-action" onclick="runAutoEvolution()">Autoevolução</button>
        </div>
      </header>

      <div class="chat-stream" id="chatStream" role="log" aria-live="polite" aria-atomic="false" aria-label="Conversa com o JARVIS" tabindex="0">
        <div class="msg-group assistant">
          <div class="msg-author">JARVIS</div>
          <div class="msg-content">Olá. O sistema está operacional com todos os módulos, análise topológica Graphify, busca web e voz local ativos. Como posso ajudar?</div>
        </div>
      </div>

      <div class="composer-container">
        <div class="composer-wrapper">
          <label for="composerInput" class="sr-only">Mensagem para o JARVIS</label>
          <textarea id="composerInput" class="composer-textarea" placeholder="Envie uma mensagem ou solicite uma análise..." rows="1"></textarea>
          <div class="composer-controls">
            <div class="quick-tools" role="group" aria-label="Ferramentas rápidas">
              <button type="button" class="tool-btn" onclick="runGraphify()">Graphify</button>
              <button type="button" class="tool-btn" onclick="runWebSearch()">Pesquisar Web</button>
              <button type="button" class="tool-btn" onclick="runVoice()">Voz Local</button>
            </div>
            <button type="button" class="btn-send" onclick="sendMsg()">Enviar</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal de Pensamentos Privados do Dono -->
  <div class="modal-overlay" id="thoughtModal" role="dialog" aria-modal="true" aria-labelledby="thoughtModalTitle" aria-hidden="true">
    <div class="modal-content">
      <div class="modal-header-clean">
        <h2 id="thoughtModalTitle" style="font-size:0.95rem; font-weight:600;">Stream de Pensamentos Privados do Dono</h2>
        <button type="button" class="btn-action" onclick="closeThoughtModal()">Fechar</button>
      </div>
      <pre id="thoughtContent" aria-live="polite" style="font-family:var(--font-mono); font-size:0.82rem; color:var(--text-secondary); white-space:pre-wrap;"></pre>
    </div>
  </div>

  <script>
    function getAuthHeaders() {
      return {
        'Content-Type': 'application/json',
        'X-Jarvis-Token': localStorage.getItem('jarvis_token') || 'test-token',
        'X-Jarvis-Device-Id': localStorage.getItem('jarvis_device_id') || 'test-device-id',
        'X-Jarvis-Nonce': 'nonce-' + Math.random().toString(36).substring(2, 10),
        'X-Jarvis-Timestamp': Date.now().toString()
      };
    }

    function apiFetch(url, options = {}) {
      const headers = Object.assign(getAuthHeaders(), options.headers || {});
      return fetch(url, Object.assign({}, options, { headers }));
    }

    function sendMsg() {
      const input = document.getElementById('composerInput');
      const text = input.value.trim();
      if (!text) return;

      appendMsg('user', 'Você', text);
      input.value = '';

      apiFetch('/api/comando', {
        method: 'POST',
        body: JSON.stringify({ texto: text })
      })
      .then(r => r.json())
      .then(d => appendMsg('assistant', 'JARVIS', d.resposta || d.mensagem || 'Comando executado.'))
      .catch(e => appendMsg('assistant', 'JARVIS', 'Erro: ' + e.message));
    }

    function appendMsg(role, author, text) {
      const stream = document.getElementById('chatStream');
      const group = document.createElement('div');
      group.className = `msg-group ${role}`;
      const authorEl = document.createElement('div');
      authorEl.className = 'msg-author';
      authorEl.textContent = author;
      const contentEl = document.createElement('div');
      contentEl.className = 'msg-content';
      contentEl.textContent = text;
      group.append(authorEl, contentEl);
      stream.appendChild(group);
      stream.scrollTop = stream.scrollHeight;
    }

    function runGraphify() {
      appendMsg('user', 'Você', 'Executar análise Graphify.');
      apiFetch('/api/graphify/estruturar?titulo=Projeto_JARVIS&descricao=Topologia', { method: 'POST' })
      .then(r => r.json())
      .then(d => appendMsg('assistant', 'JARVIS', d.resultado?.resumo_topologico_ptbr || 'Análise Graphify gerada.'));
    }

    function runWebSearch() {
      appendMsg('user', 'Você', 'Pesquisar na web.');
      apiFetch('/api/web/pesquisar?q=JARVIS+AI')
      .then(r => r.json())
      .then(d => appendMsg('assistant', 'JARVIS', `Pesquisa web concluída. ${d.total_fontes_encontradas || 0} fontes consultadas.`));
    }

    function runVoice() {
      apiFetch('/api/voz/falar?texto=JARVIS+online', { method: 'POST' })
      .then(r => r.json())
      .then(() => appendMsg('assistant', 'JARVIS', 'Áudio de voz gerado localmente.'));
    }

    function runAutoEvolution() {
      apiFetch('/api/modulos/autoevolucao/ciclo', { method: 'POST' })
      .then(r => r.json())
      .then(() => appendMsg('assistant', 'JARVIS', 'Ciclo de autoevolução executado.'));
    }

    let lastFocusBeforeModal = null;

    function openThoughtModal() {
      const modal = document.getElementById('thoughtModal');
      lastFocusBeforeModal = document.activeElement;
      modal.classList.add('active');
      modal.setAttribute('aria-hidden', 'false');
      modal.querySelector('button').focus();
      apiFetch('/api/dono/pensamentos-privados')
      .then(r => r.json())
      .then(d => {
        document.getElementById('thoughtContent').textContent = d.status === 'sucesso'
          ? JSON.stringify(d.ultimos_pensamentos, null, 2)
          : d.motivo || 'Acesso restrito.';
      });
    }

    function closeThoughtModal() {
      const modal = document.getElementById('thoughtModal');
      modal.classList.remove('active');
      modal.setAttribute('aria-hidden', 'true');
      if (lastFocusBeforeModal) lastFocusBeforeModal.focus();
    }

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && document.getElementById('thoughtModal').classList.contains('active')) {
        closeThoughtModal();
      }
    });

    document.getElementById('composerInput').addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMsg();
      }
    });

    function switchTab(tab, button) {
      document.getElementById('tabTitle').textContent = tab.toUpperCase();
      if (button) {
        document.querySelectorAll('.nav-btn[onclick^="switchTab"]').forEach((b) => {
          b.classList.remove('active');
          b.removeAttribute('aria-current');
        });
        button.classList.add('active');
        button.setAttribute('aria-current', 'page');
      }
    }

    function clearStream() {
      document.getElementById('chatStream').innerHTML = '';
      appendMsg('assistant', 'JARVIS', 'Chat limpo.');
    }
  </script>
</body>
</html>
