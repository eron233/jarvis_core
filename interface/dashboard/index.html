<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gênesis | Íris</title>
  <style>
    /* Design system Íris */
    :root {
      --bg-app: #17191d;
      --bg-sidebar: #20232a;
      --bg-card: #282c34;
      --bg-input: #303641;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-active: #9bbcf2;
      --text-primary: #edf0f5;
      --text-secondary: #b9c2cf;
      --text-muted: #aeb8c7;
      --accent-iris: #9bbcf2; 
      --accent-iris-hover: #b5cff8;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      --font-mono: "JetBrains Mono", "Cascadia Code", monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: var(--font-sans);
      background-color: var(--bg-app);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }

    .app-layout {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      width: 100vw;
      height: 100vh;
    }

    /* Sidebar Esquerda Minimalista Íris */
    .sidebar {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-subtle);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 4px 16px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .brand-icon {
      width: 24px;
      height: 24px;
      background-color: var(--accent-iris);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.85rem;
      color: #17191d;
    }

    .brand-name {
      font-size: 0.98rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text-primary);
    }

    .nav-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 16px;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text-secondary);
      background: transparent;
      border: none;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .nav-btn:hover, .nav-btn.active {
      background-color: var(--bg-card);
      color: var(--text-primary);
    }

    .sidebar-status {
      padding-top: 12px;
      border-top: 1px solid var(--border-subtle);
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--accent-iris);
    }

    /* Área Principal estilo Chat Claude Desktop */
    .main-content {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: var(--bg-app);
      position: relative;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .header-title {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .btn-action {
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-secondary);
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-action:hover {
      color: var(--text-primary);
      border-color: var(--border-active);
    }

    .chat-stream {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
    }

    .msg-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .msg-author {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .msg-content {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--text-primary);
      white-space: pre-wrap;
    }

    .msg-group.user .msg-content {
      color: #F7F6F3;
      background-color: var(--bg-card);
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
    }

    /* Composer de Texto Íris */
    .composer-container {
      padding: 16px 24px 24px;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
    }

    .composer-wrapper {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color 0.15s ease;
    }

    .composer-wrapper:focus-within {
      border-color: var(--border-active);
    }

    .composer-textarea {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.95rem;
      resize: none;
      min-height: 48px;
      max-height: 200px;
    }

    .composer-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 8px;
      border-top: 1px solid var(--border-subtle);
    }

    .quick-tools {
      display: flex;
      gap: 6px;
    }

    .tool-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      font-size: 0.8rem;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
    }

    .tool-btn:hover {
      background-color: var(--bg-input);
      color: var(--text-primary);
    }

    .btn-send {
      background-color: var(--accent-iris);
      color: #17191d;
      font-weight: 600;
      font-size: 0.82rem;
      padding: 6px 14px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn-send:hover {
      background-color: var(--accent-iris-hover);
    }

    /* Modal Discreto */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      background: rgba(0, 0, 0, 0.6);
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.active { display: flex; }

    /* Foco visível por teclado em todos os controles interativos */
    button:focus-visible,
    textarea:focus-visible {
      outline: 2px solid var(--accent-iris);
      outline-offset: 2px;
    }

    .composer-textarea:focus-visible {
      outline: none; /* o foco já é indicado pela borda do composer */
    }

    .composer-wrapper:focus-within {
      box-shadow: 0 0 0 1px var(--accent-iris);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .modal-content {
      width: min(720px, 90vw);
      background-color: var(--bg-sidebar);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 20px;
      max-height: 80vh;
      overflow-y: auto;
    }

    .msg-content { overflow-wrap: anywhere; }
    .msg-group.user { align-self: flex-end; max-width: 86%; }
    .composer-wrapper { border-radius: 16px; }
    .chat-stream { gap: 28px; padding-top: 32px; }
    .main-content { min-height: 0; }
    .composer-controls { flex-wrap: wrap; gap: 8px; }
    .quick-tools { flex-wrap: wrap; }
    .btn-send, .tool-btn, .nav-btn, .btn-action { min-height: 40px; }
    @media (max-width: 760px) {
      .app-layout { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); height: 100dvh; }
      .sidebar { padding: 8px 12px; border-right: 0; border-bottom: 1px solid var(--border-subtle); }
      .brand { border: none; padding: 4px; }
      .nav-group { flex-direction: row; overflow-x: auto; margin-top: 4px; }
      .nav-btn { flex: 0 0 auto; white-space: nowrap; }
      .sidebar-status { display: none; }
      .main-content { height: auto; }
      .header { padding: 8px 12px; gap: 8px; flex-wrap: wrap; }
      .chat-stream { padding: 18px 14px; }
      .composer-container { padding: 8px 12px 12px; }
      .msg-group.user { max-width: 95%; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }

    .modal-header-clean {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 14px;
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar Íris -->
    <aside class="sidebar">
      <div>
        <div class="brand">
          <div class="brand-icon" aria-hidden="true">Í</div>
          <div class="brand-name">GÊNESIS</div>
        </div>

        <nav class="nav-group" aria-label="Navegação principal">
          <button type="button" class="nav-btn active" aria-current="page" onclick="switchTab('chat', this)">Conversa Principal</button>
          <button type="button" class="nav-btn" onclick="switchTab('graphify', this)">Graphify Topológico</button>
          <button type="button" class="nav-btn" aria-haspopup="dialog" aria-controls="thoughtModal" onclick="openThoughtModal()">Pensamentos do Dono</button>
          <button type="button" class="nav-btn" onclick="switchTab('system', this)">Sensores & Módulos</button>
        </nav>
      </div>

      <div class="sidebar-status" role="status" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <span>Ambiente Gênesis</span>
      </div>
    </aside>

    <!-- Área Principal de Chat -->
    <main class="main-content">
      <header class="header">
        <h1 class="header-title" id="tabTitle">Sessão Atual</h1>
        <div class="header-actions">
          <button type="button" class="btn-action" onclick="clearStream()">Limpar Chat</button>
          <button type="button" class="btn-action" onclick="logout()">Sair</button>
          <button type="button" class="btn-action" onclick="runAutoEvolution()">Autoevolução</button>
        </div>
      </header>

      <div class="chat-stream" id="chatStream" role="log" aria-live="polite" aria-atomic="false" aria-label="Conversa com Íris" tabindex="0">
        <div class="msg-group assistant">
          <div class="msg-author">ÍRIS</div>
          <div class="msg-content">Olá. Sou Íris, sua assistente no Gênesis. Como posso ajudar?</div>
        </div>
      </div>

      <div class="composer-container">
        <div class="composer-wrapper">
          <label for="composerInput" class="sr-only">Mensagem para Íris</label>
          <textarea id="composerInput" class="composer-textarea" placeholder="Envie uma mensagem ou solicite uma análise..." rows="1"></textarea>
          <div class="composer-controls">
            <div class="quick-tools" role="group" aria-label="Ferramentas rápidas">
              <button type="button" class="tool-btn" onclick="runGraphify()">Graphify</button>
              <button type="button" class="tool-btn" onclick="runWebSearch()">Pesquisar Web</button>
              <button type="button" class="tool-btn" onclick="runVoice()">Voz Local</button>
            </div>
            <button type="button" class="btn-send" onclick="sendMsg()">Enviar</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal de Pensamentos Privados do Dono -->
  <div class="modal-overlay" id="thoughtModal" role="dialog" aria-modal="true" aria-labelledby="thoughtModalTitle" aria-hidden="true">
    <div class="modal-content">
      <div class="modal-header-clean">
        <h2 id="thoughtModalTitle" style="font-size:0.95rem; font-weight:600;">Stream de Pensamentos Privados do Dono</h2>
        <button type="button" class="btn-action" onclick="closeThoughtModal()">Fechar</button>
      </div>
      <pre id="thoughtContent" aria-live="polite" style="font-family:var(--font-mono); font-size:0.82rem; color:var(--text-secondary); white-space:pre-wrap;"></pre>
    </div>
  </div>

  <script>
    const DASHBOARD_CONFIG = __JARVIS_DASHBOARD_CONFIG__;
    // Remover segredos persistidos por versoes anteriores.
    try {
      for (const key of ['jarvis_api_token', 'jarvis_token', 'jarvis_device_id']) localStorage.removeItem(key);
    } catch (_) { /* cookie HttpOnly continua suficiente */ }

    function getAuthHeaders() {
      const headers = {
        'Content-Type': 'application/json',
        'X-Jarvis-Nonce': Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, '0')).join(''),
        'X-Jarvis-Timestamp': new Date().toISOString()
      };
       return headers;
    }

    async function apiFetch(url, options = {}) {
      const headers = Object.assign(getAuthHeaders(), options.headers || {});
      return fetch(url, Object.assign({}, options, { headers, credentials: 'same-origin', cache: 'no-store' })).then(response => {
        if (!response.ok) throw new Error(`Solicitação recusada (HTTP ${response.status}).`);
        return response;
      });
    }

    async function logout() {
      try {
        await apiFetch('/api/auth/device-session', {method: 'DELETE'});
        window.location.replace('/painel');
      } catch (error) {
        appendMsg('assistant', 'ÍRIS', 'Não foi possível encerrar a sessão: ' + error.message);
      }
    }

    function sendMsg() {
      const input = document.getElementById('composerInput');
      const text = input.value.trim();
      if (!text) return;

      appendMsg('user', 'Você', text);
      input.value = '';

      apiFetch('/api/comando', {
        method: 'POST',
        body: JSON.stringify({ texto: text })
      })
      .then(r => r.json())
      .then(d => appendMsg('assistant', 'ÍRIS', d.resposta || d.mensagem || d.motivo || 'O servidor não informou um resultado.'))
      .catch(e => appendMsg('assistant', 'ÍRIS', 'Erro: ' + e.message));
    }

    function appendMsg(role, author, text) {
      const stream = document.getElementById('chatStream');
      const group = document.createElement('div');
      group.className = `msg-group ${role}`;
      const authorEl = document.createElement('div');
      authorEl.className = 'msg-author';
      authorEl.textContent = author;
      const contentEl = document.createElement('div');
      contentEl.className = 'msg-content';
      contentEl.textContent = text;
      group.append(authorEl, contentEl);
      stream.appendChild(group);
      stream.scrollTop = stream.scrollHeight;
    }

    function runGraphify() {
      appendMsg('user', 'Você', 'Executar análise Graphify.');
      apiFetch('/api/graphify/estruturar?titulo=Projeto_JARVIS&descricao=Topologia', { method: 'POST' })
      .then(r => r.json())
      .then(d => appendMsg('assistant', 'ÍRIS', d.resultado?.resumo_topologico_ptbr || d.resultado?.motivo || 'Análise sem resultado confirmado.'))
      .catch(e => appendMsg('assistant', 'ÍRIS', e.message));
    }

    function runWebSearch() {
      appendMsg('user', 'Você', 'Pesquisar na web.');
      apiFetch('/api/web/pesquisar?q=JARVIS+AI')
      .then(r => r.json())
      .then(d => appendMsg('assistant', 'ÍRIS', d.status === 'sucesso' ? `Pesquisa web concluída. ${d.total_fontes_encontradas || 0} fontes consultadas.` : (d.motivo || 'Pesquisa sem resultado confirmado.')))
      .catch(e => appendMsg('assistant', 'ÍRIS', e.message));
    }

    function runVoice() {
      apiFetch('/api/voz/falar?texto=Íris+online', { method: 'POST' })
      .then(r => r.json())
      .then(d => appendMsg('assistant', 'ÍRIS', d.status === 'sucesso' ? 'Áudio de voz gerado localmente.' : (d.motivo || 'Áudio sem confirmação.')))
      .catch(e => appendMsg('assistant', 'ÍRIS', e.message));
    }

    function runAutoEvolution() {
      apiFetch('/api/modulos/autoevolucao/ciclo', { method: 'POST' })
      .then(r => r.json())
      .then(d => appendMsg('assistant', 'ÍRIS', d.relatorio?.status === 'sucesso' ? 'Ciclo de autoevolução executado.' : 'Consulte o relatório de autoevolução para confirmar o resultado.'))
      .catch(e => appendMsg('assistant', 'ÍRIS', e.message));
    }

    let lastFocusBeforeModal = null;

    function openThoughtModal() {
      const modal = document.getElementById('thoughtModal');
      document.getElementById('thoughtContent').textContent = 'Carregando…';
      lastFocusBeforeModal = document.activeElement;
      modal.classList.add('active');
      modal.setAttribute('aria-hidden', 'false');
      modal.querySelector('button').focus();
      apiFetch('/api/dono/pensamentos-privados')
      .then(r => r.json())
      .then(d => {
        document.getElementById('thoughtContent').textContent = d.status === 'sucesso'
          ? JSON.stringify(d.ultimos_pensamentos, null, 2)
          : d.motivo || 'Acesso restrito.';
      }).catch(e => { document.getElementById('thoughtContent').textContent = e.message; });
    }

    function closeThoughtModal() {
      const modal = document.getElementById('thoughtModal');
      modal.classList.remove('active');
      modal.setAttribute('aria-hidden', 'true');
      if (lastFocusBeforeModal) lastFocusBeforeModal.focus();
    }

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && document.getElementById('thoughtModal').classList.contains('active')) {
        closeThoughtModal();
      }
    });

    document.getElementById('composerInput').addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMsg();
      }
    });

    function switchTab(tab, button) {
      document.getElementById('tabTitle').textContent = tab.toUpperCase();
      if (button) {
        document.querySelectorAll('.nav-btn[onclick^="switchTab"]').forEach((b) => {
          b.classList.remove('active');
          b.removeAttribute('aria-current');
        });
        button.classList.add('active');
        button.setAttribute('aria-current', 'page');
      }
    }

    function clearStream() {
      document.getElementById('chatStream').innerHTML = '';
      appendMsg('assistant', 'ÍRIS', 'Chat limpo.');
    }
  </script>
</body>
</html>
